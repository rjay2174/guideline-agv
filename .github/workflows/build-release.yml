name: Build and publish GUIDELine AGV firmware

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Unique tag for this tested firmware release'
        required: true
        default: 'v2026.11.05-websocket-remote'
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 board platform and MFRC522 library
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install MFRC522
          arduino-cli lib install WebSockets
      - name: Compile ESP32-S3 with OTA + LittleFS partition
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:PartitionScheme=min_spiffs guideline_agv --output-dir build
          test -s build/guideline_agv.ino.bin
          cp build/guideline_agv.ino.bin firmware.bin
          sha256sum firmware.bin > firmware.bin.sha256
      - name: Publish firmware.bin as latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; choose a unique release tag."; exit 1
          fi
          gh release create "$TAG" firmware.bin firmware.bin.sha256 \
            --title "GUIDELine AGV $TAG" \
            --notes "ESP32-S3 application firmware only. Verify hardware and safety on a stand before allowing movement." \
            --latest